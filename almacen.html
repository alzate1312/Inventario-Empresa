<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Almacén - Inventario</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #0056b3; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .btn-salir { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-salir:hover { background: #c82333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .section { margin-bottom: 40px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Gestión de Almacén</h1>
        <div>
            <span id="nombreUsuario" style="margin-right: 15px; font-weight: bold;"></span>
            <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <!-- SECCIÓN: REGISTRAR NUEVO REPUESTO -->
    <div class="section">
        <h2>Registrar Nuevo Repuesto</h2>
        <form id="formRepuesto">
            <div class="form-group">
                <label>Código Interno:</label>
                <input type="text" id="repCodigo" required placeholder="Ej: REP-001">
            </div>
            <div class="form-group">
                <label>Descripción:</label>
                <textarea id="repDesc" required placeholder="Detalle del repuesto..."></textarea>
            </div>
            <div class="form-group">
                <label>Estado:</label>
                <select id="repEstado">
                    <option value="Nuevo">Nuevo</option>
                    <option value="Usado">Usado</option>
                </select>
            </div>
            <div class="form-group">
                <label>Uso Destino:</label>
                <select id="repUso">
                    <option value="Ambos">Ambos</option>
                    <option value="Venta">Venta</option>
                    <option value="Alquiler">Alquiler</option>
                </select>
            </div>
            <div class="form-group">
                <label>Stock Mínimo de Alerta:</label>
                <input type="number" id="repMinimo" value="2" required>
            </div>
            <button type="submit">Guardar Repuesto</button>
        </form>
    </div>

    <!-- SECCIÓN: REGISTRAR MOVIMIENTO (ENTRADA / SALIDA) -->
    <div class="section">
        <h2>Movimientos de Almacén (Entradas / Salidas)</h2>
        <form id="formMovimiento">
            <div class="form-group">
                <label>Tipo de Movimiento:</label>
                <select id="movTipo" onchange="cambiarTipoMovimiento()" required>
                    <option value="ENTRADA">ENTRADA (Compra / Proveedor)</option>
                    <option value="SALIDA">SALIDA (Técnico / Cliente)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Seleccionar Repuesto:</label>
                <select id="movRepuesto" required>
                    <option value="">Cargando repuestos...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cantidad:</label>
                <input type="number" id="movCantidad" min="1" value="1" required>
            </div>

            <!-- Campos exclusivos de Entrada -->
            <div id="camposEntrada">
                <div class="form-group">
                    <label>Número de Factura:</label>
                    <input type="text" id="movFactura" placeholder="Ej: FAC-9876">
                </div>
                <div class="form-group">
                    <label>Proveedor:</label>
                    <input type="text" id="movProveedor" placeholder="Nombre del proveedor">
                </div>
                <div class="form-group">
                    <label>Costo Unitario:</label>
                    <input type="number" step="0.01" id="movCostoU" placeholder="0.00">
                </div>
            </div>

            <!-- Campos exclusivos de Salida -->
            <div id="camposSalida" style="display:none;">
                <div class="form-group">
                    <label>Motivo de Salida:</label>
                    <input type="text" id="movMotivo" placeholder="Ej: Garantía, Venta, Mantenimiento">
                </div>
                <div class="form-group">
                    <label>Entregado a (Técnico / Persona):</label>
                    <input type="text" id="movEntregado" placeholder="Nombre del técnico">
                </div>
                <div class="form-group">
                    <label>Cliente:</label>
                    <input type="text" id="movCliente" placeholder="Empresa cliente">
                </div>
                <div class="form-group">
                    <label>Serial de Máquina Asociada:</label>
                    <input type="text" id="movSerial" placeholder="Serial de la impresora">
                </div>
            </div>

            <button type="submit">Registrar Movimiento</button>
        </form>
    </div>

    <!-- SECCIÓN: INVENTARIO ACTUAL -->
    <div class="section">
        <h2>Catálogo y Stock Actual</h2>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Stock Actual</th>
                    <th>Mínimo</th>
                </tr>
            </thead>
            <tbody id="tablaRepuestos">
                <tr><td colspan="5">Cargando inventario...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Validar sesión activa
    const rol = localStorage.getItem('rol');
    const nombre = localStorage.getItem('nombre');
    if (!rol || (rol !== 'almacen' && rol !== 'admin')) {
        alert('Acceso no autorizado');
        window.location.href = 'index.html';
    }
    document.getElementById('nombreUsuario').innerText = 'Usuario: ' + (nombre || rol);

    function cerrarSesion() {
        localStorage.clear();
        window.location.href = 'index.html';
    }

    function cambiarTipoMovimiento() {
        const tipo = document.getElementById('movTipo').value;
        if (tipo === 'ENTRADA') {
            document.getElementById('camposEntrada').style.display = 'block';
            document.getElementById('camposSalida').style.display = 'none';
        } else {
            document.getElementById('camposEntrada').style.display = 'none';
            document.getElementById('camposSalida').style.display = 'block';
        }
    }

    async function cargarRepuestos() {
        try {
            const res = await fetch('/api/repuestos');
            const data = await res.json();
            const select = document.getElementById('movRepuesto');
            const tabla = document.getElementById('tablaRepuestos');
            
            select.innerHTML = '<option value="">Seleccione un repuesto</option>';
            tabla.innerHTML = '';

            data.forEach(r => {
                // Llenar select
                select.innerHTML += `<option value="${r.id_repuesto}">${r.codigo_interno} - ${r.descripcion} (Stock: ${r.stock_actual})</option>`;
                
                // Llenar tabla
                tabla.innerHTML += `<tr>
                    <td>${r.codigo_interno}</td>
                    <td>${r.descripcion}</td>
                    <td>${r.estado_repuesto}</td>
                    <td style="font-weight:bold; color: ${r.stock_actual <= r.stock_minimo ? 'red' : 'green'}">${r.stock_actual}</td>
                    <td>${r.stock_minimo}</td>
                </tr>`;
            });
        } catch (err) {
            console.error('Error cargando repuestos:', err);
        }
    }

    document.getElementById('formRepuesto').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            codigo_interno: document.getElementById('repCodigo').value,
            descripcion: document.getElementById('repDesc').value,
            estado_repuesto: document.getElementById('repEstado').value,
            uso_destino: document.getElementById('repUso').value,
            stock_minimo: parseInt(document.getElementById('repMinimo').value)
        };

        const res = await fetch('/api/repuestos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const r = await res.json();
        if (res.ok) {
            alert(r.mensaje || 'Repuesto registrado');
            document.getElementById('formRepuesto').reset();
            cargarRepuestos();
        } else {
            alert(r.error || 'Error al registrar');
        }
    });

    document.getElementById('formMovimiento').addEventListener('submit', async (e) => {
        e.preventDefault();
        const tipo = document.getElementById('movTipo').value;
        const body = {
            tipo_movimiento: tipo,
            id_repuesto: document.getElementById('movRepuesto').value,
            cantidad: parseInt(document.getElementById('movCantidad').value),
            numero_factura: document.getElementById('movFactura').value,
            proveedor: document.getElementById('movProveedor').value,
            costo_unitario: parseFloat(document.getElementById('movCostoU').value) || null,
            motivo_salida: document.getElementById('movMotivo').value,
            entregado_a: document.getElementById('movEntregado').value,
            cliente: document.getElementById('movCliente').value,
            serial_maquina: document.getElementById('movSerial').value
        };

        const res = await fetch('/api/almacen/movimiento', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const r = await res.json();
        if (res.ok) {
            alert(r.mensaje || 'Movimiento registrado');
            document.getElementById('formMovimiento').reset();
            cambiarTipoMovimiento();
            cargarRepuestos();
        } else {
            alert(r.error || 'Error en el movimiento');
        }
    });

    cargarRepuestos();
</script>

</body>
</html>
