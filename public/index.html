<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Master Technology - Inicio de Sesión</title>
    <style>
        :root {
            --primary-dark: #0a1128;
            --panel-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent-cyan: #00f2fe;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body { 
            background-color: var(--primary-dark);
            background-image: 
                linear-gradient(rgba(10, 17, 40, 0.92), rgba(10, 17, 40, 0.95)), 
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main); 
        }

        .login-card {
            background: var(--panel-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .brand-title {
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .cmyk-bar {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, #00b4d8 25%, #ff007f 25% 50%, #facc15 50% 75%, #0f172a 75%);
            margin-bottom: 30px;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        button.btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button.btn-login:hover {
            opacity: 0.9;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-title">COPY MASTER</div>
        <div class="brand-sub">TECHNOLOGY</div>
        <div class="cmyk-bar"></div>

        <form id="formLogin">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="footer-note">Gestión de Inventario y Control de Equipos</div>
    </div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const usuario = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });

            const data = await res.json();

            if (res.ok && data.token) {
                // Guardar datos de autenticación en el cliente
                localStorage.setItem('token', data.token);
                localStorage.setItem('rol', data.rol);
                localStorage.setItem('nombre', data.nombre || data.usuario);

                // Enrutamiento según rol de acceso
                if (data.rol === 'admin' || data.rol === 'almacen' || data.rol === 'tecnico') {
                    window.location.href = 'almacen.html';
                } else if (data.rol === 'supervisor') {
                    window.location.href = 'supervisor.html';
                } else {
                    window.location.href = 'almacen.html';
                }
            } else {
                alert(data.error || 'Credenciales incorrectas');
            }
        } catch (err) {
            console.error('Error durante el inicio de sesión:', err);
            alert('Error de conexión con el servidor.');
        }
    });
</script>

</body>
</html>
